[pytest]
# Pytest configuration

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    classical_ml: Classical ML pipeline tests
    data: Data loading and validation tests
    features: Feature engineering tests
    model: Model training tests
    predictions: Prediction tests
    threshold: Threshold optimization tests
    robustness: Robustness and edge case tests

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.8
